        buildConfigField("String", "NOVAHOST_API_URL", "\"${properties.getProperty("novahost.api_url") ?: properties.getProperty("supabase.url") ?: ""}\"")
        buildConfigField("String", "NOVAHOST_API_KEY", "\"${properties.getProperty("novahost.api_key") ?: properties.getProperty("supabase.anon_key") ?: ""}\"")
        buildConfigField("String", "FINNHUB_API_KEY", "\"${properties.getProperty("finnhub.api_key") ?: ""}\"")
        buildConfigField("String", "FMP_API_KEY", "\"${properties.getProperty("fmp.api_key") ?: ""}\"")
    }

    buildFeatures {
        compose = true
        buildConfig = true
    }

    // Release signing.
    //
    // The upload key is read from `keystore.properties` at the repo root (which
    // is gitignored) or, failing that, from environment variables so CI can
    // sign without a file on disk. Nothing about the key is committed.
    //
    // Absent entirely, `storeFile` stays null and the release buildType below
    // simply does not attach a signing config -- so a fresh checkout can still
    // run `assembleRelease` to check that the build and R8 rules are sound. It
    // just produces an unsigned artifact, which the Play Console will reject.
    signingConfigs {
        release {
            def keystoreProps = new java.util.Properties()
            def keystoreFile = rootProject.file("keystore.properties")
            if (keystoreFile.exists()) {
                keystoreFile.withInputStream { keystoreProps.load(it) }
            }

            def resolvedStore = keystoreProps.getProperty("storeFile")
                    ?: System.getenv("NOVAHOST_STORE_FILE")

            if (resolvedStore) {
                storeFile = file(resolvedStore)
                storePassword = keystoreProps.getProperty("storePassword")
                        ?: System.getenv("NOVAHOST_STORE_PASSWORD")
                keyAlias = keystoreProps.getProperty("keyAlias")
                        ?: System.getenv("NOVAHOST_KEY_ALIAS")
                keyPassword = keystoreProps.getProperty("keyPassword")
                        ?: System.getenv("NOVAHOST_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        release {
            // Attached only when a keystore actually resolved. Wiring it
            // unconditionally makes every release build fail on a machine that
            // has no key, which is the wrong failure for a developer who only
            // wanted to check that R8 does not break the app.
            if (signingConfigs.release.storeFile != null) {
                signingConfig = signingConfigs.release
            }

            // R8 is OFF for the direct-download release. The keep rules in
            // proguard-rules.pro cover MetaAPI and com.novahost.** but NOT
            // kotlinx.serialization, ktor or supabase-kt -- and this build ships
            // straight to users with no QA pass, where a stripped @Serializable
            // serializer surfaces as "the app can't reach the server". Turn this
            // back on once the keep rules are complete and there is a test cycle.
            minifyEnabled false
            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose = true
    }

    packaging {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
            excludes += "META-INF/DEPENDENCIES"
            excludes += "META-INF/LICENSE"
            excludes += "META-INF/LICENSE.txt"
            excludes += "META-INF/NOTICE"
            excludes += "META-INF/NOTICE.txt"
            excludes += "META-INF/ASL2.0"
